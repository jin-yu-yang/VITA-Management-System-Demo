<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1426" width="1760" height="1426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Tax return lifecycle</title>
  <style>
    :root {
      --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --line: #3d444d;
      --intake: #e7f0fd; --intake-b: #3b73c4;
      --work: #f3f4f6; --work-b: #59636e;
      --file: #e6f4ea; --file-b: #2f8a4c;
      --amend: #fdf1dc; --amend-b: #b7791f;
      --exit: #fbe9e9; --exit-b: #b94a48;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --ink: #e6edf3; --muted: #9198a1; --line: #b1bac4;
        --intake: #13243d; --intake-b: #6ea8fe;
        --work: #1c2128; --work-b: #9198a1;
        --file: #12281a; --file-b: #56d364;
        --amend: #2d2210; --amend-b: #e3b341;
        --exit: #2d1414; --exit-b: #f47067;
      }
    }
    .bg { fill: var(--bg); }
    .n rect { stroke-width: 1.6; }
    .n text { fill: var(--ink); font-size: 15px; text-anchor: middle; dominant-baseline: central; }
    .n text.sub { fill: var(--muted); font-size: 12.5px; }
    .intake rect { fill: var(--intake); stroke: var(--intake-b); }
    .work rect   { fill: var(--work);   stroke: var(--work-b); }
    .file rect   { fill: var(--file);   stroke: var(--file-b); }
    .amend rect  { fill: var(--amend);  stroke: var(--amend-b); }
    .exit rect   { fill: var(--exit);   stroke: var(--exit-b); }
    .any rect    { fill: none; stroke: var(--muted); stroke-dasharray: 6 5; }
    .e { fill: none; stroke: var(--line); stroke-width: 1.5; marker-end: url(#arrow); }
    .lbl { fill: var(--muted); font-size: 13px; font-style: italic; text-anchor: middle;
           paint-order: stroke; stroke: var(--bg); stroke-width: 7px; stroke-linejoin: round; }
    .h { fill: var(--ink); font-size: 15px; font-weight: 600; }
    .title { fill: var(--ink); font-size: 24px; font-weight: 700; }
    .note { fill: var(--muted); font-size: 13px; }
    .start { fill: var(--line); }
    .end-o { fill: none; stroke: var(--line); stroke-width: 1.6; }
    .end-i { fill: var(--line); }
    .divider { stroke: var(--muted); stroke-opacity: .35; stroke-dasharray: 4 6; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <g id="end"><circle class="end-o" r="10"/><circle class="end-i" r="5.5"/></g>
  </defs>

  <rect class="bg" width="1760" height="1426"/>
  <text class="title" x="40" y="56">Tax return lifecycle</text>
  <text class="note" x="40" y="80">Main flow (left) · other entries and exits (right)</text>

  <!-- ================= Edges (drawn under nodes) ================= -->
  <!-- entry -->
  <circle class="start" cx="600" cy="40" r="8"/>
  <path class="e" d="M600,48 V84"/>
  <path class="e" d="M600,134 V192"/>
  <text class="lbl" x="600" y="165">Opened by an admin</text>
  <path class="e" d="M600,240 V298"/>

  <!-- intake outcomes -->
  <path class="e" d="M480,326 H327"/>
  <path class="e" d="M505,352 C470,406 400,426 327,426"/>
  <path class="e" d="M540,352 C505,486 410,526 327,526"/>
  <path class="e" d="M135,326 H72"/><use href="#end" x="60" y="326"/>
  <path class="e" d="M135,426 H72"/><use href="#end" x="60" y="426"/>
  <path class="e" d="M135,526 H72"/><use href="#end" x="60" y="526"/>

  <!-- documents loop -->
  <path class="e" d="M720,318 C850,318 945,356 945,420"/>
  <text class="lbl" x="850" y="328">Missing document(s)</text>
  <path class="e" d="M855,458 C760,458 690,416 668,354"/>
  <text class="lbl" x="752" y="446">Once submitted</text>

  <!-- hold loop -->
  <path class="e" d="M1010,470 C1090,486 1180,506 1180,560"/>
  <text class="lbl" x="1140" y="484">Took a long time for</text>
  <text class="lbl" x="1140" y="502">the client to respond</text>
  <path class="e" d="M1105,600 C1010,606 955,556 948,472"/>
  <text class="lbl" x="1010" y="628">Got in touch with the client</text>
  <path class="e" d="M1255,586 H1298"/><use href="#end" x="1310" y="586"/>

  <!-- preparation & review -->
  <path class="e" d="M600,352 V520"/>
  <text class="lbl" x="600" y="440">All good</text>
  <path class="e" d="M600,570 V630"/>
  <text class="lbl" x="600" y="605">Once prepared</text>
  <path class="e" d="M600,680 V730"/>
  <path class="e" d="M600,780 V840"/>
  <path class="e" d="M600,890 V950"/>
  <text class="lbl" x="600" y="925">Once client signed</text>

  <!-- filing method -->
  <path class="e" d="M540,1000 C540,1036 330,1021 330,1058"/>
  <path class="e" d="M600,1000 V1060"/>
  <path class="e" d="M660,1000 C660,1036 870,1021 870,1058"/>
  <path class="e" d="M330,1112 C330,1176 420,1196 498,1196"/>
  <path class="e" d="M600,1110 V1170"/>
  <path class="e" d="M870,1112 C870,1176 780,1196 702,1196"/>

  <!-- IRS outcome -->
  <path class="e" d="M560,1220 C540,1256 460,1256 452,1280"/>
  <path class="e" d="M640,1220 C660,1256 750,1256 758,1280"/>
  <path class="e" d="M450,1330 V1374"/><use href="#end" x="450" y="1386"/>

  <!-- rejection loop -->
  <path class="e" d="M840,1306 C1110,1306 1110,866 702,866"/>
  <text class="lbl" x="1040" y="1082">Return to signing</text>
  <text class="lbl" x="1040" y="1100">(once fixed)</text>

  <!-- amendment loop -->
  <path class="e" d="M370,1306 H287"/>
  <path class="e" d="M190,1282 V892"/>
  <path class="e" d="M285,866 H498"/>

  <!-- ================= Nodes ================= -->
  <g class="n intake">
    <rect x="490" y="86" width="220" height="48" rx="10"/><text x="600" y="110">Request sent</text>
    <rect x="490" y="192" width="220" height="48" rx="10"/><text x="600" y="216">Screening in progress</text>
    <rect x="480" y="300" width="240" height="52" rx="10"/><text x="600" y="326">Pending intake / filing</text>
    <rect x="855" y="422" width="210" height="48" rx="10"/><text x="960" y="446">Waiting for documents</text>
    <rect x="1105" y="562" width="150" height="48" rx="10"/><text x="1180" y="586">Hold</text>
  </g>
  <g class="n exit">
    <rect x="135" y="302" width="190" height="48" rx="10"/><text x="230" y="326">Out of scope</text>
    <rect x="135" y="402" width="190" height="48" rx="10"/><text x="230" y="426">No need to file</text>
    <rect x="135" y="502" width="190" height="48" rx="10"/><text x="230" y="526">Duplicate</text>
  </g>
  <g class="n work">
    <rect x="475" y="522" width="250" height="48" rx="10"/><text x="600" y="546">Filing in progress (preparing)</text>
    <rect x="500" y="632" width="200" height="48" rx="10"/><text x="600" y="656">Pending review</text>
    <rect x="500" y="732" width="200" height="48" rx="10"/><text x="600" y="756">Review in progress</text>
    <rect x="500" y="842" width="200" height="48" rx="10"/><text x="600" y="866">Ready to exit</text>
  </g>
  <g class="n file">
    <rect x="500" y="952" width="200" height="48" rx="10"/><text x="600" y="976">Ready to e-file</text>
    <rect x="220" y="1060" width="220" height="52" rx="10"/><text x="330" y="1078">Both e-filed</text><text class="sub" x="330" y="1097">(1040 / PA-40)</text>
    <rect x="500" y="1062" width="200" height="48" rx="10"/><text x="600" y="1086">E-filed &amp; paper</text>
    <rect x="760" y="1060" width="220" height="52" rx="10"/><text x="870" y="1078">Both paper</text><text class="sub" x="870" y="1097">(1040 / PA-40)</text>
    <rect x="500" y="1172" width="200" height="48" rx="10"/><text x="600" y="1190">IRS acknowledged</text><text class="sub" x="600" y="1208">(the wait at E-filed)</text>
    <rect x="370" y="1282" width="160" height="48" rx="10"/><text x="450" y="1306">Accepted</text>
  </g>
  <g class="n exit">
    <rect x="680" y="1282" width="160" height="48" rx="10"/><text x="760" y="1306">Rejected</text>
  </g>
  <g class="n amend">
    <rect x="95" y="1282" width="190" height="48" rx="10"/><text x="190" y="1297">Amendment needed</text><text class="sub" x="190" y="1316">(not built yet)</text>
    <rect x="95" y="842" width="190" height="48" rx="10"/><text x="190" y="857">Amendment in progress</text><text class="sub" x="190" y="876">(not built yet)</text>
  </g>

  <!-- ================= Side panel ================= -->
  <line class="divider" x1="1370" y1="40" x2="1370" y2="1386"/>

  <text class="h" x="1410" y="56">Other entry points</text>
  <circle class="start" cx="1560" cy="84" r="8"/>
  <path class="e" d="M1560,92 V124"/>
  <g class="n intake">
    <rect x="1410" y="126" width="300" height="48" rx="10"/><text x="1560" y="150">Same day in progress (untracked)</text>
  </g>
  <circle class="start" cx="1560" cy="206" r="8"/>
  <path class="e" d="M1560,214 V246"/>
  <g class="n intake">
    <rect x="1410" y="248" width="300" height="64" rx="10"/>
    <text x="1560" y="270">FSA (Facilitated Self-Assistance)</text>
    <text class="sub" x="1560" y="292">Self-prep client needs help; no need to prepare</text>
  </g>

  <text class="h" x="1410" y="386">From any stage</text>
  <g class="n any">
    <rect x="1460" y="408" width="200" height="44" rx="22"/><text x="1560" y="430">Any active stage</text>
  </g>
  <path class="e" d="M1560,452 V554"/>
  <text class="lbl" x="1560" y="506">Client unreachable</text>
  <g class="n exit">
    <rect x="1460" y="556" width="200" height="48" rx="10"/><text x="1560" y="580">Dismissed</text>
  </g>
  <path class="e" d="M1560,604 V648"/><use href="#end" x="1560" y="660"/>

  <text class="h" x="1410" y="736">Other terminal state</text>
  <g class="n exit">
    <rect x="1460" y="758" width="200" height="48" rx="10"/><text x="1560" y="782">Withdrawn</text>
  </g>
  <path class="e" d="M1560,806 V850"/><use href="#end" x="1560" y="862"/>

  <!-- legend -->
  <text class="h" x="1410" y="960">Legend</text>
  <circle class="start" cx="1422" cy="994" r="8"/><text class="note" x="1444" y="998">Entry point</text>
  <use href="#end" x="1422" y="1028"/><text class="note" x="1444" y="1032">Case closed</text>
  <g class="n intake"><rect x="1412" y="1052" width="20" height="16" rx="4"/></g><text class="note" x="1444" y="1065">Intake</text>
  <g class="n work"><rect x="1412" y="1080" width="20" height="16" rx="4"/></g><text class="note" x="1444" y="1093">Preparation &amp; review</text>
  <g class="n file"><rect x="1412" y="1108" width="20" height="16" rx="4"/></g><text class="note" x="1444" y="1121">Filing</text>
  <g class="n amend"><rect x="1412" y="1136" width="20" height="16" rx="4"/></g><text class="note" x="1444" y="1149">Amendment</text>
  <g class="n exit"><rect x="1412" y="1164" width="20" height="16" rx="4"/></g><text class="note" x="1444" y="1177">Stopped or rejected</text>
</svg>
